<!DOCTYPE html>

<html lang="{{ .Lang }}" data-theme="light">
	<head>
		{{ if $.ThemeToggle }}
		<script src="/js/themeInit.min.js"></script>
		{{ end }}
		{{ template "head" . }}
	</head>

	<body class="bg-pattern">
		<main class="container" id="app">
			{{ template "content" . }}</main>
		{{ template "footer" . }}
	</body>

</html>
